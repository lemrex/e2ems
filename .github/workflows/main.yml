name: CI/CD to Huawei SWR and CCE

on:
  push:
    branches:
      - mains

env:
  REGION: af-south-1
  REGISTRY: swr.af-south-1.myhuaweicloud.com/ralf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3


      - name: Build and push Docker images
        run: |

          


          
          docker build -t $REGISTRY/frontend-f:latest ./frontend
          docker push $REGISTRY/frontend-f:latest
          
          docker build -t $REGISTRY/authentication-f:${{ github.sha }} ./authentication
          docker push $REGISTRY/authentication-f:${{ github.sha }}

          docker build -t $REGISTRY/transaction-f:${{ github.sha }} ./transaction
          docker push $REGISTRY/transaction-f:${{ github.sha }}



